name: CI

on:
  push:
  pull_request:

jobs:
  client:
    name: Client – install, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://example.com/api

  server:
    name: Server – install, syntax check and Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - name: Check every file parses
        run: for f in $(find src scripts -name '*.js'); do node --check "$f"; done
      - name: Build the Docker image
        run: docker build -t jobtrackr-api .
